# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sysmocrud

# Hibernate ORM - gera/atualiza as tabelas automaticamente com base nas @Entity
# Lembrar de trocar update por validate quando terminar tudo.
quarkus.hibernate-orm.database.generation=update
