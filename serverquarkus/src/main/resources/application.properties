# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sysmocrud

# Hibernate ORM - gera/atualiza as tabelas automaticamente com base nas @Entity
# Lembrar de trocar update por validate quando terminar tudo.
quarkus.hibernate-orm.database.generation=update

# CORS - libera o front Angular (outra porta/origem) para chamar as APIs
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=SysmoCrud - API de Tarefas
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para gerenciamento de tarefas
quarkus.swagger-ui.always-include=true